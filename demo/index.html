<style>
:root{--ink:#222;--muted:#6a6a6a;--page:#f2f2f2;--out:cubic-bezier(.22,1,.36,1);--ios:cubic-bezier(.32,.72,0,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Figtree,system-ui,sans-serif;color:var(--ink);background:var(--page);-webkit-font-smoothing:antialiased;overflow:hidden}
body.embed{--page:transparent;background:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

/* page chrome (standalone only) */
.chrome{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px}
.picker{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.picker button{height:36px;padding:0 14px;border-radius:999px;border:1px solid #ddd;background:#fff;font-size:14px;font-weight:600}
.picker button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.cap{min-height:20px;font-size:14px;color:var(--muted);text-align:center;max-width:360px}
.embed .picker,.embed .cap{display:none}
.embed .chrome{padding:0;gap:0}
.frame{position:relative;width:calc(390px * var(--k));height:calc(844px * var(--k));flex:none}

/* device: every screen is the Figma frame itself */
.dev{position:absolute;left:0;top:0;width:390px;height:844px;transform:scale(var(--k));transform-origin:0 0;border-radius:40px;overflow:hidden;background:#fff;isolation:isolate;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 24px 48px rgba(0,0,0,.14)}
.embed .dev{box-shadow:0 0 0 1px rgba(0,0,0,.06),0 18px 40px rgba(0,0,0,.12)}
.scr{position:absolute;inset:0;visibility:hidden;background:#fff;will-change:transform,opacity}
.scr.on{visibility:visible;z-index:2}
.scr.under{visibility:visible;z-index:1}
.scr svg{display:block;width:390px;height:844px}
.scr .dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}

/* things you can tap */
.scr [data-hot]{cursor:pointer;transition:opacity .15s}
.scr [data-hot]:active{opacity:.7}
.scr [data-hot].hint{animation:hint 1.8s var(--out) infinite}
@keyframes hint{0%,100%{filter:drop-shadow(0 0 0 rgba(227,28,95,0))}50%{filter:drop-shadow(0 0 10px rgba(227,28,95,.55))}}

/* component motion */
.scr [data-n]:not([transform]){transform-box:fill-box;transform-origin:center}
.rise{animation:rise .55s var(--out) both}
@keyframes rise{from{opacity:0;translate:0 16px}to{opacity:1;translate:0 0}}
.pop{animation:pop .7s var(--out) both}
@keyframes pop{0%{opacity:0;scale:.72}60%{opacity:1}100%{opacity:1;scale:1}}
.drop{animation:drop .7s var(--out) both}
@keyframes drop{from{opacity:0;translate:0 -36px;scale:.96}to{opacity:1;translate:0 0;scale:1}}
.fadeout{transition:opacity .2s;opacity:0}
.ring{transition:stroke-dasharray 1s var(--out)}
.typing circle,.typing ellipse,.typing rect{animation:dot 1.2s ease-in-out infinite}
.typing :nth-child(2){animation-delay:.15s}.typing :nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{translate:0 0;opacity:.5}30%{translate:0 -3px;opacity:1}}
.bar-indet{animation:indet 1.4s cubic-bezier(.65,0,.35,1) infinite}
@keyframes indet{0%{translate:-110% 0}100%{translate:260% 0}}
.breathe{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{scale:1}50%{scale:1.04}}

.toast{position:absolute;z-index:50;left:50%;bottom:150px;transform:translate(-50%,20px);padding:10px 16px;border-radius:999px;background:#222;color:#fff;font-size:14px;font-weight:500;white-space:nowrap;opacity:0;transition:opacity .3s,transform .4s var(--out);pointer-events:none}
.toast.in{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

  }

  dev.addEventListener('click', (e) => {
    const el = e.target.closest('[data-hot]'); if (!el) return;
    const [act, arg] = el.dataset.hot.split(/:(.*)/s);
    clearAll();
    if (act === 'go') go(arg, FAMILY[stack[stack.length - 1]] === 'step' && FAMILY[arg] === 'step' ? 'replace' : 'auto');
    else if (act === 'modal') go(arg);
    else if (act === 'back') { if (stack.length > 1) go(stack[stack.length - 2], 'back'); }
    else if (act === 'toast') { toast(arg); auto(stack[stack.length - 1]); }
    else if (act === 'restart') start(scenario === 'scroll' ? 'host' : scenario);
    else if (act === 'sendlink') { toast('Link sent to Aisha'); later(() => go(stack[stack.length - 2], 'back'), 1200); }
    else if (act === 'hostsent') { toast(arg + '. Meera sees it on her status screen.'); caption('Meera’s screen moves to “Seen” the moment the host responds.'); later(() => start('hostphone'), 3600); }
  });

  function start(sc) {
    scenario = sc; clearAll(); stack = [];
    $$('.picker button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.sc === sc)));
    const first = { host: 'trips', nobody: 'cohost', network: 'offline', hostphone: 'lock', safety: 'cohost' }[sc] || 'trips';
    go(first, 'cut');
    if (sc === 'safety') caption('“I don’t feel safe” sits on every help screen. Tap it.');
  }

  // Jump to one named screen with no timers, so the page's scroll can drive the prototype step by step.
  const ORDER = ['trips', 'problem', 'fixes', 'cohost', 'host', 'lock', 'lockexp', 'seen', 'replied', 'chat', 'in', 'noanswer', 'support', 'supchat', 'bed', 'booked', 'offline', 'sent', 'group', 'safety'];
  function show(k) {
    if (!scr(k)) return;
    scenario = 'scroll'; clearAll();
    const a = stack[stack.length - 1];
    if (!a) return go(k, 'cut');
    const back = ORDER.indexOf(k) < ORDER.indexOf(a) && !(FAMILY[a] && FAMILY[a] === FAMILY[k]);
    if (back) { stack = [k, a]; go(k, 'back'); } else go(k, FAMILY[a] && FAMILY[a] === FAMILY[k] ? 'replace' : 'auto');
  }

  $$('.picker button').forEach((b) => b.addEventListener('click', () => { location.hash = b.dataset.sc; }));
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (AUTO[h] || ['host', 'hostphone', 'safety'].includes(h)) start(h); });
  window.addEventListener('message', (e) => {
    if (!e.data) return;
    if (e.data.proto === 'start') start(e.data.sc);
    else if (e.data.proto === 'show') show(e.data.step);
  });

  function fit() {
    const padX = embed ? 56 : 0, padY = embed ? 72 : 140;
    const k = Math.min((window.innerWidth - padX) / 390, (window.innerHeight - padY) / 844, embed ? 2 : 1);
    document.documentElement.style.setProperty('--k', k.toFixed(4));
  }
  window.addEventListener('resize', fit); fit();
  // A scenario name starts that night; any other screen name opens straight on that screen for a scroll story.
  const h0 = location.hash.slice(1);
  if (['host', 'nobody', 'network', 'hostphone', 'safety'].includes(h0)) start(h0);
  else { start('host'); if (h0 && h0 !== 'trips') { stack = []; scenario = 'scroll'; go(h0, 'cut'); } }
  window.__proto = { start, show, go, get stack() { return stack; }, get cur() { return stack[stack.length - 1]; } };
})();
</script>
